<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header will be loaded dynamically -->
  <div id="main-header"></div>

  <main class="divider">
    <section class="checkout">
      <h2>Review & Place your Order</h2>
      
      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <ul class="checkout-cart-list">
          <!-- Cart items will be loaded here -->
        </ul>
        <div class="order-total">
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax (6%): <span id="tax">$0.00</span></p>
          <p>Shipping: <span id="shipping">$0.00</span></p>
          <p class="total"><strong>Order Total: <span id="order-total">$0.00</span></strong></p>
        </div>
      </div>

      <!-- Checkout Form -->
      <form id="checkout-form" class="checkout-form">
        <fieldset>
          <legend>Shipping Information</legend>
          
          <label for="fname">First Name <span class="required">*</span></label>
          <input type="text" id="fname" name="fname" required>
          
          <label for="lname">Last Name <span class="required">*</span></label>
          <input type="text" id="lname" name="lname" required>
          
          <label for="street">Street <span class="required">*</span></label>
          <input type="text" id="street" name="street" required>
          
          <label for="city">City <span class="required">*</span></label>
          <input type="text" id="city" name="city" required>
          
          <label for="state">State <span class="required">*</span></label>
          <input type="text" id="state" name="state" required>
          
          <label for="zip">Zip <span class="required">*</span></label>
          <input type="text" id="zip" name="zip" required>
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>
          
          <label for="cardNumber">Card Number <span class="required">*</span></label>
          <input type="text" id="cardNumber" name="cardNumber" required>
          
          <label for="expiration">Expiration <span class="required">*</span></label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required>
          
          <label for="code">Security Code <span class="required">*</span></label>
          <input type="text" id="code" name="code" required>
        </fieldset>

        <button type="submit" class="checkout-btn">Complete Purchase</button>
      </form>
    </section>
  </main>

  <!-- Footer will be loaded dynamically -->
  <div id="main-footer"></div>

  <script src="../js/checkout.js" type="module"></script>
</body>
</html>
